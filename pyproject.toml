[project]
name = "pelada-manager"
version = "0.1.0"
description = "API para organizar pelada: confirmação de presença, lista de espera, sorteio de times e mensalidades."
readme = "README.md"
license = "MIT"
authors = [{ name = "Miguelbbezerra", email = "carlosmiguelcm820@gmail.com" }]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14",
    "fastapi>=0.115",
    "jinja2>=3.1",
    "psycopg[binary]>=3.2",
    "pwdlib[argon2]>=0.2",
    "pydantic-settings>=2.6",
    "pydantic[email]>=2.10",
    "pyjwt>=2.10",
    "python-multipart>=0.0.18",
    "redis>=5.2",
    "sqlalchemy>=2.0.36",
    "tzdata>=2024.2",
    "uvicorn[standard]>=0.32",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "SIM", "N", "RUF", "S", "PTH"]
ignore = ["B008"] # Depends() em default de parâmetro é o padrão do FastAPI

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S311"]
"alembic/**" = ["N999"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["app", "tests"]

[[tool.mypy.overrides]]
module = ["fakeredis.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["--strict-markers", "-ra"]
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 90

[dependency-groups]
dev = [
    "fakeredis>=2.40.0",
    "httpx2>=2.16.0",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.2",
]
