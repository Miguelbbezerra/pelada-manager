# Stack completa: API + Postgres + Redis.
# Os valores padrão (${VAR:-...}) são só para desenvolvimento local; em
# qualquer outro ambiente defina tudo num .env (veja .env.example).

x-database-url: &database-url
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-pelada}:${POSTGRES_PASSWORD:-pelada}@db:5432/${POSTGRES_DB:-pelada}

services:
  api:
    build: .
    environment:
      <<: *database-url
      REDIS_URL: redis://cache:6379/0
      JWT_SECRET: ${JWT_SECRET:-dev-only-nao-use-em-producao-troque-isso}
      ENVIRONMENT: ${ENVIRONMENT:-dev}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8010}
    ports:
      - "127.0.0.1:${API_PORT:-8010}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      cache:
        condition: service_healthy
    restart: unless-stopped

  # roda as migrations e sai; a api só sobe depois que isso terminar com sucesso
  migrate:
    build: .
    command: ["alembic", "upgrade", "head"]
    environment:
      <<: *database-url
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  db:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pelada}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pelada}
      POSTGRES_DB: ${POSTGRES_DB:-pelada}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    # exposto só no localhost, pra rodar os testes e usar psql/DBeaver de fora
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  cache:
    image: redis:7.4-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
